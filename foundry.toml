# Foundry di root repo (deployguide-xofn.md §2, ARCHITECTURE.md §6).
# Phase 6–7 FROZEN: tidak ada [etherscan], verifier, atau profil deploy publik di file ini.

[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib", "node_modules"]
auto_detect_remappings = false
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = ["*"]
# config/: definisi tier; out/: artefak ABI untuk tes allowlist; deployments/: hanya local.json.
# node_modules/@uniswap/*: artefak Uniswap v4 bawaan paket (PoolManager dan PositionManager
# ber-pragma 0.8.26, tidak bisa dikompilasi dengan solc 0.8.24). Hanya untuk tes dan Anvil.
fs_permissions = [
  { access = "read", path = "./config" },
  { access = "read", path = "./out" },
  { access = "read", path = "./node_modules/@uniswap/v4-core/out" },
  { access = "read", path = "./node_modules/@uniswap/v4-periphery/foundry-out" },
  { access = "read-write", path = "./deployments" },
]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1000
depth = 128
fail_on_revert = true

[fmt]
line_length = 100

# Hanya untuk fork test READ-ONLY. Nilai dibaca dari env; tidak ada RPC deploy di sini.
[rpc_endpoints]
robinhood = "${FORK_RPC_ROBINHOOD}"
base = "${FORK_RPC_BASE}"
arbitrum = "${FORK_RPC_ARBITRUM}"
